# Render Blueprints Library
# https://render.com/docs/blueprints-library
services:
  # Frontend Service
  - type: web
    name: antibioticplay-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve dist -s -l $PORT
    envVars:
      - key: VITE_API_BASE_URL
        value: https://antibioticplay-backend.onrender.com/api
    plan: free
    autoDeploy: true
    healthCheckPath: /

  # Backend Service
  - type: web
    name: antibioticplay-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
