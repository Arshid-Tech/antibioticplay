# Render Blueprint Specification
# https://render.com/docs/blueprint-spec

databases:
  - name: antibioticplay-db
    databaseName: antibioticplay
    user: antibioticplay
    plan: free

services:
  # Backend API Service (Flask + PostgreSQL)
  - type: web
    name: antibioticplay-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python seed_db.py --if-empty && gunicorn -b 0.0.0.0:$PORT run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: antibioticplay-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://antibioticplay.arshid.tech,https://antibioticplay-frontend-gjsx.onrender.com,https://antibioticplay-frontend.onrender.com,https://antibioticplay.ir,https://www.antibioticplay.ir
    plan: free
    autoDeploy: true
    healthCheckPath: /health

  # Frontend Web Service (Vue 3 + Vite)
  - type: web
    name: antibioticplay-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npx serve dist -s -l $PORT
    envVars:
      - key: VITE_API_BASE_URL
        value: https://antibioticplay-backend.onrender.com/api
    plan: free
    autoDeploy: true
    healthCheckPath: /
